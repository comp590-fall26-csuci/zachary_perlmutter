- name: Lab 7
  hosts: target
  become: true
  vars:
    gitea_version: 28.3.0 
    gitea_db_user: git
    gitea_db_name: gitea
    gitea_db_pass: secure_password  # I'm assuming this doesn't actually need to be secure for this lab
    gitea_source: https://dl.gitea.com/
  tasks:
    ## database setup
    - name: Install Postgres
      apt:
        name: postgresql
        state: present
        update_cache: yes
    - name: Start Postgres
      service:
        name: postgresql
        state: started
        enabled: true
    - name: create postgres user/database
      become: true
      become_user: postgres
      register: gitea_db_setup
      changed_when: "'CREATE' in gitea_db_setup.stdout" # this would indicate that the corresponding data was created
      command:
        argv:
          - psql
          - "-vON_ERROR_STOP=1"
          - "-vuser={{gitea_db_user}}"
          - "-vname={{gitea_db_name}}"
          - "-vpass={{gitea_db_pass}}"
        # create roles as needed
        stdin: |
          SELECT format('CREATE ROLE %I WITH LOGIN PASSWORD %L', :'user', :'pass')
          WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'user') \gexec
          SELECT format('CREATE DATABASE %I WITH OWNER %I TEMPLATE template0 ENCODING UTF8 LC_COLLATE ''en_US.UTF-8'' LC_CTYPE ''en_US.UTF-8''', :'name', :'user')
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'name') \gexec

    ## gitea setup
    - name: Ensure Git is installed
      apt:
        name: git
        state: present
        update_cache: yes
    - name: add service group
      group:
        name: git
    - name: add service user
      user:
        name: git
        group: git
        shell: /bin/bash
        system: true
        comment: Git Version Control
    - name: create file structure
      vars:
        lib: /var/lib/gitea 
      file:
        path: "{{ item.path }}"
        owner: "{{ item.owner | default('git') }}"
        group: git
        recurse: true
        mode: "{{ item.mode | default('750') }}"
        state: directory
      loop:
        - { path: "{{lib}}" }
        - { path: "{{lib}}/custom" }
        - { path: "{{lib}}/data" }
        - { path: "{{lib}}/log" }
        - { path: /etc/gitea, owner: root, mode: '770' }
    - name: download gitea executable
      get_url:
        # as a note, this implementation would need additional handlers to handle updates
        url: "{{gitea_source}}/gitea/{{gitea_version}}/gitea-{{gitea_version}}-linux-amd64"
        dest: /usr/local/bin/gitea
        mode: +x
    - name: generate completion
      command: gitea completion bash
    ## service setup
    - name: create service file
      notify: restart gitea
      vars:
        service_url: 'https://raw.githubusercontent.com/go-gitea/gitea/refs/heads/main/contrib/service/systemd/gitea.service'
      copy:
        dest: /etc/systemd/system/gitea.service
        owner: root
        group: root
        mode: 644
        # retrieve service file and replace with dependencies. the lookup retrieves the url
        # as a note this doesn't currently use redis
        content: |-
          {{ 
            lookup('ansible.builtin.url', service_url, split_lines=False) |
            regex_replace('^#((?:Wants|After)=(?:postgresql)\.service)$', '\1')
          }}
  handlers:
    - name: restart gitea
      systemd:
        name: gitea
        state: restarted
        enabled: true
        daemon_reload: true
